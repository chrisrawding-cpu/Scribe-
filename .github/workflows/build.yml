name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional but recommended: a stable signing key, so the SHA-1 you register in Google Cloud
      # never changes and new builds install over old ones. See README → "Stable signing key".
      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > scribe-release.jks
            {
              echo "storeFile=scribe-release.jks"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
            } > signing.properties
            echo "Using stable signing key from repository secrets"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret — APK is signed with a throwaway debug key (SHA-1 changes every build)."
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Show signing certificate (register this SHA-1 in Google Cloud)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$APK" dist/Scribe.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs dist/Scribe.apk | tee dist/signing-cert.txt
          SHA1=$(grep -m1 "SHA-1 digest" dist/signing-cert.txt | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          echo "SHA-1 for your Android OAuth client: $SHA1" | tee -a dist/signing-cert.txt
          echo "### Signing SHA-1: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Scribe-apk
          path: dist/

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scribe build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/Scribe.apk
            dist/signing-cert.txt
          body: |
            Download **Scribe.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when prompted).

            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            The signing certificate SHA-1 is in signing-cert.txt and is also shown in the app under Settings.
